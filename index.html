
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ♡</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #10101c;
            color: #fff4fa;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .heart {
            font-size: 120px;
            color: #ff3f91;
            animation: beat 1s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ff3f91);
        }

        h1 {
            color: #ff9acb;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <div class="heart">♥</div>
    <h1>Selamat Malam, Cantik 🌙</h1>
    <p>Semoga malam ini membawa ketenangan untukmu. 💗</p>
</body>
</html>
